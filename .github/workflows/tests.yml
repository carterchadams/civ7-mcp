name: tests
on:
  push:
  pull_request:
jobs:
  observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv .venv && .venv/bin/pip install -q -e 'civ7-observer[test]'
      - run: cd civ7-observer && ./run-tests.sh
      - name: clean install check
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install -q ./civ7-observer
          cd / && /tmp/clean/bin/python -m civ7_observer doctor --json --port 1 --timeout 0.5 | grep -q DEBUGGER_UNAVAILABLE
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: civ7-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
