[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civ7-observer"
version = "0.1.0"
description = "Local companion for one Civilization VII player via the Cohtml UI debugger (CDP): seat-bound observation plus a constrained native-action catalog."
requires-python = ">=3.12"
dependencies = [
    "websocket-client>=1.7,<2",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
civ7-observer = "civ7_observer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civ7_observer = ["payloads/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
